name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  precache:
    name: service worker precaches what index.html loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-precache.mjs

  cachebust:
    name: a changed stylesheet or script carries a new ?v=
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: versions move when the files do
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          node scripts/check-cachebust.mjs origin/main

  overlays:
    name: every dialog renders over the page, not in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-overlays.mjs

  sections:
    name: one table of panels, one writer for the address bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-sections.mjs

  cache:
    name: cache keeps one member's data out of another's session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/cache-test.mjs

  syntax:
    name: changed javascript parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: parse
        run: |
          set -e
          find js functions scripts -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
          node --check sw.js
          node --check uploadVerifier.js
          node --check aiAssistantData.js
