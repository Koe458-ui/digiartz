# The checks that stop a known fault coming back.
#
# There is no build step in this project, so this is deliberately small: it does
# not lint, and it tests one file. What it holds is an invariant that has broken
# twice, the invariants of the cache service — where a mistake is a disclosure
# rather than a glitch — and that everything served to a browser parses.
name: checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  precache:
    name: service worker precaches what index.html loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No dependencies to install and nothing to build — the check is one
      # file of plain Node reading two other files.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-precache.mjs

  overlays:
    name: every dialog renders over the page, not in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A dialog styled by id gives a second dialog copying its markup no
      # position and no display:none, so it lands in the page flow and is
      # permanently visible. Every inner class can be correct while this is
      # wrong, which is why reviewing the classes did not catch it.
      - run: node scripts/check-overlays.mjs

  cache:
    name: cache keeps one member's data out of another's session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No browser and no IndexedDB, which is the point twice over: the
      # user-isolation and invalidation rules hold in plain Node, and the
      # service has to stay correct with its disk tier missing.
      - run: node scripts/cache-test.mjs

  syntax:
    name: changed javascript parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22, not 20, and it matters: js/legal-content.js is ESM served to the
      # browser from a .js file, and only 22 detects module syntax on its own.
      # On 20, `node --check` reads it as CommonJS and stops at `export`.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # sw.js and the Pages Functions are served straight to browsers and to
      # the edge with nothing in between to catch a typo. `node --check` is
      # not a test, but it does mean a syntax error cannot reach production.
      - name: parse
        run: |
          set -e
          find js functions scripts -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
          node --check sw.js
          node --check uploadVerifier.js
          node --check aiAssistantData.js
